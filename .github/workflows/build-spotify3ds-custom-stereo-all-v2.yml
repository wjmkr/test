  console:
    needs: prepare
    runs-on: ubuntu-22.04
    container:
      image: devkitpro/devkitarm@sha256:15b79ce75822c289538d8153da5fa7aafe5e6adc32ad8a575a197beca0f0761b
    env:
      BANNERTOOL_VERSION: "1.2.0"
      BANNERTOOL_SHA256: 69768596f836acb3e3aeaa66e47c6ba560dde813c6dfcd33c8afc25fe29b7524
      MAKEROM_VERSION: "0.18.4"
      MAKEROM_SHA256: dd596854718c195c6e3229286be485b122921715555af8ae5cf8e9a465d9f970
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: patched-source
      - run: tar -xzf patched-source.tar.gz

      - name: Host tests
        working-directory: spotify3ds
        run: ./tests/run_host_tests.sh

      - name: Prepare Noto Sans KR
        working-directory: spotify3ds
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends python3-pip
          if ! command -v mkbcfnt >/dev/null 2>&1; then
            dkp-pacman -Sy --needed --noconfirm tex3ds
          fi
          python -m pip install --break-system-packages fonttools
          command -v mkbcfnt

          curl --fail --location --retry 3 \
            -o /tmp/NotoSansKR-VF.ttf \
            'https://raw.githubusercontent.com/google/fonts/main/ofl/notosanskr/NotoSansKR%5Bwght%5D.ttf'
          curl --fail --location --retry 3 \
            -o /tmp/NotoSansKR-OFL.txt \
            'https://raw.githubusercontent.com/google/fonts/main/ofl/notosanskr/OFL.txt'

          python tools/prepare_noto_font.py \
            /tmp/NotoSansKR-VF.ttf \
            /tmp/NotoSansKR-Regular-3DS.ttf
          mkbcfnt -s 30 -o data/NotoSansKR.bin /tmp/NotoSansKR-Regular-3DS.ttf
          test -s data/NotoSansKR.bin
          ls -lh data/NotoSansKR.bin

      - name: Install CIA packaging tools
        shell: bash
        run: |
          set -euo pipefail
          tools_dir="$RUNNER_TEMP/release-tools"
          mkdir -p "$tools_dir"

          bannertool_archive="$RUNNER_TEMP/bannertool.zip"
          curl --fail --location --retry 3 \
            --output "$bannertool_archive" \
            "https://github.com/diasurgical/bannertool/releases/download/${BANNERTOOL_VERSION}/bannertool.zip"
          printf '%s  %s\n' "$BANNERTOOL_SHA256" "$bannertool_archive" | sha256sum --check --strict
          unzip -j "$bannertool_archive" linux-x86_64/bannertool -d "$tools_dir"
          chmod 0755 "$tools_dir/bannertool"

          makerom_archive="$RUNNER_TEMP/makerom.zip"
          curl --fail --location --retry 3 \
            --output "$makerom_archive" \
            "https://github.com/3DSGuy/Project_CTR/releases/download/makerom-v${MAKEROM_VERSION}/makerom-v${MAKEROM_VERSION}-ubuntu_x86_64.zip"
          printf '%s  %s\n' "$MAKEROM_SHA256" "$makerom_archive" | sha256sum --check --strict
          unzip -j "$makerom_archive" makerom -d "$tools_dir"
          chmod 0755 "$tools_dir/makerom"
          echo "$tools_dir" >> "$GITHUB_PATH"

      - name: Build CIA and 3DSX
        working-directory: spotify3ds
        shell: bash
        run: |
          set -euo pipefail
          make -j"$(nproc)"
          test -s Spotify3DS.cia
          test -s Spotify3DS.3dsx
          mkdir -p ../console-out
          cp Spotify3DS.cia Spotify3DS.3dsx ../console-out/
          cp /tmp/NotoSansKR-OFL.txt ../console-out/NotoSansKR-OFL.txt
          sha256sum ../console-out/*

      - uses: actions/upload-artifact@v4
        with:
          name: console-build
          path: console-out/*
          retention-days: 1

  android:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: patched-source
      - run: tar -xzf patched-source.tar.gz

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Use preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Phone Bridge APK
        shell: bash
        run: |
          set -euo pipefail
          gradle -p spotify3ds/android-bridge :app:assembleDebug
          mkdir -p android-out
          cp spotify3ds/android-bridge/app/build/outputs/apk/debug/app-debug.apk \
             android-out/Spotify3DS-Phone-Bridge-Audio.apk
          sha256sum android-out/Spotify3DS-Phone-Bridge-Audio.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: android-out/*
          retention-days: 1

  bundle:
    needs: [console, android]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "*-build"
          path: final
          merge-multiple: true

      - name: Make final bundle
        shell: bash
        run: |
          set -euo pipefail
          cd final
          sha256sum Spotify3DS.cia Spotify3DS.3dsx Spotify3DS-Phone-Bridge-Audio.apk > SHA256SUMS.txt
          ls -lh

      - uses: actions/upload-artifact@v4
        with:
          name: Spotify3DS-Custom-Ready
          path: final/*
          if-no-files-found: error
          retention-days: 30
