      - name: Package patched source
        shell: bash
        run: tar -czf patched-source.tar.gz spotify3ds

      - name: Upload patched source
        uses: actions/upload-artifact@v4
        with:
          name: patched-source
          path: patched-source.tar.gz
          retention-days: 1

  console:
    needs: prepare
    runs-on: ubuntu-22.04
    container:
      image: devkitpro/devkitarm@sha256:15b79ce75822c289538d8153da5fa7aafe5e6adc32ad8a575a197beca0f0761b
    env:
      BANNERTOOL_VERSION: "1.2.0"
      BANNERTOOL_SHA256: 69768596f836acb3e3aeaa66e47c6ba560dde813c6dfcd33c8afc25fe29b7524
      MAKEROM_VERSION: "0.18.4"
      MAKEROM_SHA256: dd596854718c195c6e3229286be485b122921715555af8ae5cf8e9a465d9f970
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: patched-source
      - run: tar -xzf patched-source.tar.gz

      - name: Host tests
        working-directory: spotify3ds
        run: ./tests/run_host_tests.sh

      - name: Prepare Noto Sans KR
        working-directory: spotify3ds
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends \
            python3-pip ca-certificates autoconf automake libtool pkg-config bzip2
          python -m pip install --break-system-packages fonttools
          command -v mkbcfnt

          # Build the official devkitPro 3DS mpg123 port directly instead of
          # using dkp-pacman. This avoids transient/geo-specific 403 errors
          # from pkg.devkitpro.org while using the exact upstream port patch.
          MPG123_VERSION=1.31.3
          MPG123_TARBALL=/tmp/mpg123-${MPG123_VERSION}.tar.bz2
          MPG123_PATCH=/tmp/mpg123-${MPG123_VERSION}.patch
          curl --fail --location --retry 5 \
            -o "$MPG123_TARBALL" \
            "https://downloads.sourceforge.net/sourceforge/mpg123/mpg123-${MPG123_VERSION}.tar.bz2"
          printf '%s  %s\n' \
            '1ca77d3a69a5ff845b7a0536f783fee554e1041139a6b978f6afe14f5814ad1a' \
            "$MPG123_TARBALL" | sha256sum --check --strict
          curl --fail --location --retry 5 \
            -o "$MPG123_PATCH" \
            "https://raw.githubusercontent.com/devkitPro/pacman-packages/master/3ds/mpg123/mpg123-${MPG123_VERSION}.patch"
          printf '%s  %s\n' \
            '9af6c4c39d4cc58c5b81bf6e26a95fe9bf8322f583a98ec73f0362214a3c3b89' \
            "$MPG123_PATCH" | sha256sum --check --strict
          rm -rf /tmp/mpg123-src
          mkdir -p /tmp/mpg123-src
          tar -xjf "$MPG123_TARBALL" -C /tmp/mpg123-src
          pushd "/tmp/mpg123-src/mpg123-${MPG123_VERSION}"
          patch -Np1 -i "$MPG123_PATCH"
          source /opt/devkitpro/3dsvars.sh
          autoreconf -fi
          ./configure --prefix="${PORTLIBS_PREFIX}" --host=arm-none-eabi \
            --disable-shared --enable-static --enable-fifo=no \
            --enable-ipv6=no --enable-network=no --enable-int-quality=no \
            --with-cpu=generic --with-default-audio=dummy
          make -j"$(nproc)"
          make install
          popd
          test -f "${PORTLIBS_PREFIX}/include/mpg123.h"
          test -f "${PORTLIBS_PREFIX}/lib/libmpg123.a"

          curl --fail --location --retry 3 \
            -o /tmp/NotoSansKR-VF.ttf \
            'https://raw.githubusercontent.com/google/fonts/main/ofl/notosanskr/NotoSansKR%5Bwght%5D.ttf'
          curl --fail --location --retry 3 \
            -o /tmp/NotoSansKR-OFL.txt \
            'https://raw.githubusercontent.com/google/fonts/main/ofl/notosanskr/OFL.txt'

          python tools/prepare_noto_font.py \
            /tmp/NotoSansKR-VF.ttf \
            /tmp/NotoSansKR-Regular-3DS.ttf
          mkbcfnt -s 30 -o data/NotoSansKR.bin /tmp/NotoSansKR-Regular-3DS.ttf
          test -s data/NotoSansKR.bin
          ls -lh data/NotoSansKR.bin

          # Generic HTTPS trust store for user-supplied Internet stream URLs.
          cp /etc/ssl/certs/ca-certificates.crt data/ca_bundle.pem
          test -s data/ca_bundle.pem
          ls -lh data/ca_bundle.pem

      - name: Install CIA packaging tools
        shell: bash
        run: |
          set -euo pipefail
          tools_dir="$RUNNER_TEMP/release-tools"
          mkdir -p "$tools_dir"

          bannertool_archive="$RUNNER_TEMP/bannertool.zip"
          curl --fail --location --retry 3 \
            --output "$bannertool_archive" \
            "https://github.com/diasurgical/bannertool/releases/download/${BANNERTOOL_VERSION}/bannertool.zip"
          printf '%s  %s\n' "$BANNERTOOL_SHA256" "$bannertool_archive" | sha256sum --check --strict
          unzip -j "$bannertool_archive" linux-x86_64/bannertool -d "$tools_dir"
          chmod 0755 "$tools_dir/bannertool"

          makerom_archive="$RUNNER_TEMP/makerom.zip"
          curl --fail --location --retry 3 \
            --output "$makerom_archive" \
            "https://github.com/3DSGuy/Project_CTR/releases/download/makerom-v${MAKEROM_VERSION}/makerom-v${MAKEROM_VERSION}-ubuntu_x86_64.zip"
          printf '%s  %s\n' "$MAKEROM_SHA256" "$makerom_archive" | sha256sum --check --strict
          unzip -j "$makerom_archive" makerom -d "$tools_dir"
          chmod 0755 "$tools_dir/makerom"
          echo "$tools_dir" >> "$GITHUB_PATH"

      - name: Build CIA and 3DSX
        working-directory: spotify3ds
        shell: bash
        run: |
          set -euo pipefail
          make -j"$(nproc)"
          test -s Spotify3DS.cia
          test -s Spotify3DS.3dsx
          mkdir -p ../console-out
          cp Spotify3DS.cia Spotify3DS.3dsx ../console-out/
          cp /tmp/NotoSansKR-OFL.txt ../console-out/NotoSansKR-OFL.txt
          cp INTERNET_STREAM_V5.md ../console-out/
          sha256sum ../console-out/*

      - uses: actions/upload-artifact@v4
        with:
          name: console-build
          path: console-out/*
          retention-days: 1

  android:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: patched-source
      - run: tar -xzf patched-source.tar.gz

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Use preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Phone Bridge APK
        shell: bash
        run: |
          set -euo pipefail
          gradle -p spotify3ds/android-bridge :app:assembleDebug
          mkdir -p android-out
          cp spotify3ds/android-bridge/app/build/outputs/apk/debug/app-debug.apk \
             android-out/Spotify3DS-Companion.apk
          sha256sum android-out/Spotify3DS-Companion.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: android-out/*
          retention-days: 1

  bundle:
    needs: [console, android]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "*-build"
          path: final
          merge-multiple: true

      - name: Make final bundle
        shell: bash
        run: |
          set -euo pipefail
          cd final
          sha256sum Spotify3DS.cia Spotify3DS.3dsx Spotify3DS-Companion.apk > SHA256SUMS.txt
          ls -lh

      - uses: actions/upload-artifact@v4
        with:
          name: Spotify3DS-Custom-Ready-v6
          path: final/*
          if-no-files-found: error
          retention-days: 30
